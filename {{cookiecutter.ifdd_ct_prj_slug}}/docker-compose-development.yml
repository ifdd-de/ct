# Development: build locally and use the source tree without rebuilding.
#   docker compose -f docker-compose-development.yml build
#   docker compose -f docker-compose-development.yml run --rm ct --list
#
# ./src and ./private are mounted over the installed copies, so code changes
# take effect on the next run.

services:
  ct:
    build:
      context: .
      args:
        VERSION: {{ cookiecutter.ifdd_ct_version }}-dev
    image: {{ cookiecutter.ifdd_ct_prj_slug }}:dev
    user: "${IFDD_CT_UID:-1000}:${IFDD_CT_GID:-1000}"
    environment:
      PYTHONPATH: /opt/ifdd-ct/src
      IFDD_CT_LOG_LEVEL: ${IFDD_CT_LOG_LEVEL:-INFO}
      IFDD_CT_BE_URL: ${IFDD_CT_BE_URL:?set IFDD_CT_BE_URL in .env}
      IFDD_CT_SCHEMA_URL: ${IFDD_CT_SCHEMA_URL:-}
      IFDD_CT_TYPE_URL: ${IFDD_CT_TYPE_URL:-}
      IFDD_CT_UNIT_URL: ${IFDD_CT_UNIT_URL:-}
      IFDD_CT_TS_API_URL: ${IFDD_CT_TS_API_URL:-}
      IFDD_CT_ASPECTS: ${IFDD_CT_ASPECTS:-}
      IFDD_CT_OIDC_TOKEN_URL: ${IFDD_CT_OIDC_TOKEN_URL:-}
      IFDD_CT_OIDC_CLIENT_ID: ${IFDD_CT_OIDC_CLIENT_ID:-}
      IFDD_CT_OIDC_CLIENT_SECRET: ${IFDD_CT_OIDC_CLIENT_SECRET:-}
      IFDD_CT_CA_BUNDLE: ${IFDD_CT_CA_BUNDLE:-}
      IFDD_CT_HTTP_TIMEOUT: ${IFDD_CT_HTTP_TIMEOUT:-30}
      IFDD_CT_CONTEXT_DIR: ${IFDD_CT_CONTEXT_DIR:-}
    volumes:
      - ./src:/opt/ifdd-ct/src:ro
      - ./private:/opt/ifdd-ct/private:ro
      - ./data:/data
      - ./plugins:/plugins:ro
      - ./certs:/certs:ro
    networks:
      - proxy

networks:
  proxy:
    name: {{ cookiecutter.ifdd_proxy_network }}
    external: true
