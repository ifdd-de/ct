name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install (pinned, hash-checked)
        run: |
          pip install --require-hashes -r requirements.txt
          pip install --no-deps -e .
          pip install pytest pytest-cov

      - name: Test (fails below 95 % coverage)
        run: pytest -q

  image:
    name: Image and compose files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build --tag ct:ci .

      - name: The image runs and finds its plugins
        run: |
          docker run --rm ct:ci --version
          docker run --rm ct:ci --list | tee list.txt
          grep -q "builtin.faker" list.txt
          ! grep -q "not available" list.txt
          docker run --rm ct:ci --markdown > plugins.md
          grep -qx '(ifdd-ct-plugin-builtin-faker)=' plugins.md

      - name: Faker works without any service
        run: |
          docker run --rm -e IFDD_CT_BE_URL=https://rest -e IFDD_CT_SCHEMA_URL=https://schema/v1 \
            ct:ci faker:seed=1,product=1 count > /dev/null

      - name: check warns by default and fails with fail=true
        # Offline: contexts and documents come from tests/fixtures.
        run: |
          run_ct() {
            docker run --rm -v "$PWD/tests/fixtures:/fixtures:ro" \
              -e IFDD_CT_CONTEXT_DIR=/fixtures/contexts ct:ci "$@"
          }
          run_ct /fixtures/documents/check-clean.jsonld check:fail=true > /dev/null
          run_ct /fixtures/documents/check-typo.jsonld check > /dev/null 2> warn.txt
          cat warn.txt
          grep -q "undefined terms: nmae" warn.txt
          if run_ct /fixtures/documents/check-typo.jsonld check:fail=true > /dev/null; then
            echo "check:fail=true should have failed"; exit 1
          fi

      - name: Compose files are valid
        run: |
          cp dotenv.dist .env
          docker compose -f docker-compose-production.yml config --quiet
          docker compose -f docker-compose-development.yml config --quiet

  template:
    name: Template drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install cruft
        run: pip install cruft

      - name: Is this instance behind its template?
        # Informational: being behind is a decision, not a failure.
        continue-on-error: true
        run: cruft check

      - name: How far has this instance drifted from its template?
        # Everything shown here is a backport candidate: it either belongs
        # upstream in the template, or the file belongs on the skip list.
        continue-on-error: true
        run: cruft diff
