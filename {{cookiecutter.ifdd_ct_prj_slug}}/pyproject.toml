[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ifdd-ct"
version = "{{ cookiecutter.ifdd_ct_version }}"
description = "IFDD Core Tools - a plugin pipeline for JSON-LD data"
readme = "README.md"
requires-python = ">=3.13"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = [
    "Faker>=40",
    "PyLD>=3.3,<4",
    "PyYAML>=6.0",
    "requests>=2.32",
]

[project.optional-dependencies]
# Libraries for planned plugins (VMware, database, graph, units, RDF).
# The container image installs them all; see requirements.txt.
plugins = [
    "Jinja2>=3.1",
    "networkx>=3.5",
    "Pint>=0.25",
    "psycopg2-binary>=2.9.11",
    "pyvmomi>=9.0",
    "rdflib>=7.1",
    "SQLAlchemy>=2.0",
    "ttl-cache>=1.6",
]
dev = [
    "pytest>=8.4",
    "pytest-cov>=6.0",
]

[project.scripts]
ifdd-ct = "ifdd.ct.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ifdd.ct*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--import-mode=importlib --cov --cov-report=term-missing:skip-covered"

[tool.coverage.run]
source = ["ifdd.ct"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.cruft]
# Owned by this instance: template updates never touch these paths.
skip = [
    ".env",
    "certs",
    "data",
    "plugins",
    "private",
    "tests/private",
]
